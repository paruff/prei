name: Post-Commit PR Gates

# One required check protects main: "All Gates Passed" (branch protection).
# Docker Accept and the authenticated ZAP scan are jobs here, run only when the
# PR touches paths that can break them, so the gate stays a single check.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: "📝 PR Title"
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (/^(WIP:|\[WIP\])\s/i.test(title)) { return; }
            const types = ['feat', 'fix', 'docs', 'style', 'refactor', 'perf', 'test', 'build', 'ci', 'chore', 'revert'];
            const pattern = new RegExp(`^(${types.join('|')})(\\([a-z0-9/._-]+\\))?!?:\\s[a-z].+`);
            if (!pattern.test(title)) {
              core.setFailed(`PR title "${title}" does not follow Conventional Commits. Expected: type(scope): description`);
            }

  # ── Static checks: .pre-commit-config.yaml is the single source of truth ───

  static:
    name: "🔍 Static Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Install pre-commit
        run: pip install pre-commit==4.6.2
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # hadolint needs a host binary (run below via docker); gitleaks only sees
      # staged changes as a hook, so the full-history scan is the `secrets` job.
      - name: Pre-commit (ruff, mypy, djlint, design, DESIGN.md, pins, hygiene)
        env:
          SKIP: hadolint,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < Dockerfile

  secrets:
    name: "🔑 Secrets"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Which optional jobs does this PR need? ────────────────────────────────

  changes:
    name: "🧭 Changed Paths"
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          docker=false
          security=false
          if echo "$files" | grep -qE '^(core/|templates/|investor_app/|tests_bdd/|tests/acceptance/|scripts/entrypoint\.sh|Dockerfile|docker-compose\.yml|requirements\.txt|Makefile|\.github/workflows/ci-quality\.yml)'; then docker=true; fi
          if echo "$files" | grep -qE '^(investor_app/|core/middleware\.py|core/decorators\.py|core/views/permissions\.py|templates/|\.zap/|requirements\.txt|Dockerfile|\.github/workflows/ci-quality\.yml)'; then security=true; fi
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "security=$security" >> "$GITHUB_OUTPUT"
          echo "docker-accept=$docker zap=$security"

  # ── Tests: one install per job, split by layer ────────────────────────────

  tests-fast:
    name: "🧪 Unit + Checks"
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: investor_app.settings_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev
      - name: Install dependencies
        run: pip install -r requirements.txt coverage
      - name: Django checks, migrations, static files
        run: |
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(50))')
          python manage.py check
          python manage.py makemigrations --check --dry-run --noinput
          python manage.py collectstatic --noinput --verbosity 0
      - name: Run unit tests
        run: |
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(50))')
          coverage run --parallel-mode -m pytest tests/ core/tests/ -m unit \
            -q --tb=short
      - name: Flaky test report
        if: always()
        run: python .github/scripts/flaky_report.py --report-log .pytest-report.jsonl --mode report --fail-over 2
      # Real HTTP against pytest-django's live_server (BASE_URL unset).
      - name: Run acceptance tests
        run: |
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(50))')
          coverage run --parallel-mode -m pytest tests/acceptance/ -m acceptance \
            -q --tb=short --report-log=.pytest-report-acceptance.jsonl
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-fast
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1
      - name: Upload test report log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-log-fast
          path: .pytest-report*.jsonl
          retention-days: 1

  tests-integration:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: investor_app.settings_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev
      - name: Install dependencies
        run: pip install -r requirements.txt coverage
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.0
      - name: Install Playwright
        run: playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps only
        run: playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 0
      - name: Run integration tests
        run: |
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(50))')
          coverage run --parallel-mode -m pytest tests/ core/tests/ -m integration \
            -q --tb=short
      - name: Flaky test report
        if: always()
        run: python .github/scripts/flaky_report.py --report-log .pytest-report.jsonl --mode report --fail-over 2
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1
      - name: Upload test report log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-log-integration
          path: .pytest-report.jsonl
          retention-days: 1

  tests-e2e:
    name: "🌐 E2E Tests"
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: investor_app.settings_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev
      - name: Install dependencies
        run: pip install -r requirements.txt coverage
      - name: Install Playwright
        run: playwright install --with-deps chromium
      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 0
      - name: Run E2E tests
        run: |
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(50))')
          coverage run --parallel-mode -m pytest tests/ core/tests/ -m e2e \
            -q --tb=short
      - name: Flaky test report
        if: always()
        run: python .github/scripts/flaky_report.py --report-log .pytest-report.jsonl --mode report --fail-over 2
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1
      - name: Upload test report log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-log-e2e
          path: .pytest-report.jsonl
          retention-days: 1

  coverage:
    name: "📊 Coverage"
    needs: [tests-fast, tests-integration, tests-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Install coverage
        run: pip install coverage
      - name: Download fast coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-fast
      - name: Download integration coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-integration
      - name: Download e2e coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-e2e
      - name: Combine and report
        run: |
          coverage combine
          coverage report --fail-under=75

  # ── Container proof: only when the PR can change what the image does ──────

  docker-accept:
    name: "🐳 Journey proof (container)"
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Install test deps
        run: pip install -r requirements.txt -q
      # Makefile's ensure-env uses [[ ]], which /bin/sh (dash) lacks.
      - name: Create .env
        run: |
          cp .env.example .env
          # .env.example is production-shaped; the journey talks plain HTTP.
          sed -i -e 's/^DJANGO_ENV=.*/DJANGO_ENV=development/' -e 's/^DEBUG=.*/DEBUG=True/' -e 's/^SECURE_SSL_REDIRECT=.*/SECURE_SSL_REDIRECT=False/' .env
      - name: Build, start, seed, run journey, stop
        timeout-minutes: 12
        run: make docker-accept
      - name: Container logs on failure
        if: failure() || cancelled()
        run: docker compose logs --no-color --tail 200 || true

  # ── Authenticated security scan (ephemeral CI instance, not live deploy) ──
  # See docs/KNOWN_LIMITATIONS.md LIMIT-22. Runs on PRs that touch settings,
  # middleware, auth/permissions, templates or dependencies; the nightly
  # workflow runs the same scan unconditionally.

  zap-authenticated-scan:
    name: "🛡️ Authenticated ZAP Scan"
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: investor_app.settings_test
      SECRET_KEY: ci-zap-scan-key
      DATABASE_URL: "sqlite:////tmp/zap_scan.sqlite3"
      ZAP_AUTH_USERNAME: zap-ci-scan-only
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-setup
      - name: Generate throwaway scan credential
        run: |
          echo "ZAP_AUTH_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements.txt -q
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 0
      - name: Seed ZAP scan user
        run: python manage.py seed_zap_scan_user
      - name: Render ZAP auth context
        run: |
          CREDS_B64=$(printf 'username=%s&password=%s' "$ZAP_AUTH_USERNAME" "$ZAP_AUTH_PASSWORD" | base64 -w0)
          sed "s/__ZAP_AUTH_CREDS_B64__/$CREDS_B64/" .zap/prei-auth-context.xml > .zap/prei-auth-context-runtime.xml
      - name: Start server
        run: nohup python manage.py runserver 0.0.0.0:8000 > server.log 2>&1 &
      - name: Wait for healthy
        run: |
          set -e
          HEALTHY=0
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/health/ 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Healthy after ~$((i * 2))s"
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::Server never became healthy within 120s"
            cat server.log || true
            exit 1
          fi
      - name: OWASP ZAP Authenticated Full Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: "http://localhost:8000"
          allow_issue_writing: false
          fail_action: true
          cmd_options: "-a -n /zap/wrk/.zap/prei-auth-context-runtime.xml -U zap-ci-scan-only -I"
      - name: Server logs
        if: always()
        run: cat server.log || true

  # ── The one required check ────────────────────────────────────────────────
  # Conditional jobs (docker-accept, zap) are "skipped" when not needed; that is
  # fine. Any failed or cancelled job fails the gate.

  pr-gates-pass:
    name: "All Gates Passed"
    needs: [pr-title, static, secrets, changes, tests-fast, tests-integration, tests-e2e, coverage, docker-accept, zap-authenticated-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all gates
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ A gate failed or was cancelled:"
          echo '${{ toJSON(needs) }}' | python3 -c 'import json,sys; [print(" ", k, v["result"]) for k, v in json.load(sys.stdin).items() if v["result"] != "success"]'
          exit 1
      - name: All gates passed
        run: echo "✅ All gates passed"
