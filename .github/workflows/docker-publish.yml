name: Build, Publish & Attest

# Push to main (or a v* tag): build the image once, scan it, smoke-test the
# exact digest, then tag and attest it. workflow_dispatch runs build, scan and
# smoke only (publish and attest are limited to main and tags), so this file can
# be checked from a branch before it merges.

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-image:
    name: "🏗️ Build Image"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=PREI - Real Estate Investment Analyzer
            org.opencontainers.image.description=Django app for RE investment KPIs
            org.opencontainers.image.vendor=paruff
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version string
        id: version
        run: |
          # Tag push → use tag name; branch push → use short SHA
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0-dev+sha-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +%y.%m.%d.%H)" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      # Pushed by digest only (no build-<sha> tag to pile up in GHCR); the
      # publish job attaches the real tags to this same digest.
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build-date }}
            BRANCH=${{ steps.version.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-image:
    name: "🛡️ Scan Image"
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Nightly uploads the SARIF report; this scan only gates the publish.
      - name: Trivy — block HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-image.outputs.image-digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          version: v0.74.0
          timeout: 10m
          skip-version-check: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: "💨 Smoke (built image)"
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start container
        env:
          IMAGE_DIGEST: ${{ needs.build-image.outputs.image-digest }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$IMAGE_DIGEST"
          docker run -d \
            --name prei-live-test \
            -p 8000:8000 \
            -e SECRET_KEY=ci-live-test-key-$(date +%s) \
            -e DJANGO_ENV=development \
            -e DEBUG=True \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=sqlite:////tmp/live_test.db \
            -e RUN_MIGRATIONS=1 \
            -e SKIP_SEED=1 \
            -e SKIP_COLLECTSTATIC=1 \
            "$IMAGE"
      - name: Wait for healthy
        run: |
          set -e
          sleep 3
          if [ -z "$(docker ps -q -f name=prei-live-test)" ]; then
            echo "::error::Container exited immediately"
            docker logs prei-live-test || true
            exit 1
          fi
          HEALTHY=0
          for i in $(seq 1 90); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/health/ 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Healthy after ~$((i * 2))s"
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::Container never became healthy within 180s"
            docker logs prei-live-test || true
            exit 1
          fi
      # The user journey against the container runs on every PR (docker-accept
      # job in ci-quality.yml); this only proves the built artifact boots.
      - name: Smoke tests
        run: |
          set -e
          echo -n "1. Health check: "
          curl -sf http://localhost:8000/health/ | python3 -m json.tool | grep -q '"status": "ok"' && echo "PASS" || { echo "FAIL"; exit 1; }
          echo -n "2. Login page: "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/accounts/login/)
          [ "$STATUS" = "200" ] && echo "PASS ($STATUS)" || { echo "FAIL ($STATUS)"; exit 1; }
          echo -n "3. Listings API: "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/listings/)
          [ "$STATUS" = "200" ] && echo "PASS ($STATUS)" || echo "WARN ($STATUS)"
          echo -n "4. Growth areas API: "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/api/v1/real-estate/growth-areas")
          [ "$STATUS" = "200" ] && echo "PASS ($STATUS)" || echo "WARN ($STATUS)"
          echo -n "5. Foreclosures API: "
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/foreclosures)
          [ "$STATUS" = "200" ] && echo "PASS ($STATUS)" || echo "WARN ($STATUS)"
          echo -n "6. Discovery page: "
          curl -sf -o /dev/null -w "PASS (%{http_code})" http://localhost:8000/discovery/; echo ""
          echo -n "7. Pipeline screener: "
          curl -sf -o /dev/null -w "PASS (%{http_code})" http://localhost:8000/pipeline/screener/; echo ""
          echo -n "8. Health API: "
          curl -sf -o /dev/null -w "PASS (%{http_code})" http://localhost:8000/api/health/; echo ""
          echo -n "9. Static CSS: "
          curl -sf -o /dev/null -w "PASS (%{http_code})" http://localhost:8000/static/css/base.css; echo ""
          echo -n "10. PDF renderer (headless Chromium in image): "
          docker exec prei-live-test python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content('<h1>artifact check</h1>')
              assert page.pdf(format='A4')[:4] == b'%PDF'
              browser.close()
          " >/dev/null 2>&1 && echo "PASS" || { echo "FAIL — PDF export would 500 in production"; exit 1; }
      - name: Container logs on failure
        if: failure()
        run: docker logs prei-live-test || true
      - name: Clean up
        if: always()
        run: docker rm -f prei-live-test 2>/dev/null || true

  publish:
    name: "📤 Publish"
    needs: [build-image, scan-image, smoke]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tags from built image
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-image.outputs.image-digest }}
          TARGET_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<<"$TARGET_TAGS"
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "No target tags were generated."
            exit 1
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done
          docker buildx imagetools create "${args[@]}" "$SOURCE_IMAGE"

  attest:
    name: "🧾 Attest"
    needs: [publish, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-image.outputs.image-digest }}
          push-to-registry: true
