[pytest]
DJANGO_SETTINGS_MODULE = investor_app.settings_test
python_files = tests.py test_*.py *_tests.py
testpaths = tests core/tests tests_bdd
addopts = --reruns 1 --reruns-delay 5 --report-log=.pytest-report.jsonl -m "unit or integration"
markers =
    unit: Fast tests with no DB, no external services, no filesystem I/O
    integration: Tests that need database access or fixtures but no external APIs
    e2e: End-to-end tests simulating full pipeline or browser flows
    smoke: Container/Docker smoke tests (build, startup, curl, BDD in container)
    acceptance: httpx-based HTTP acceptance tests against live_server or BASE_URL
    live: Tests that run against live external data sources/APIs (network & API key gated)
    slow: Tests that take longer than usual to complete

[pytest_asyncio]
asyncio_mode = strict
