services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.13"
    working_dir: /workspaces/prei
    command: sleep infinity
    volumes:
      - ..:/workspaces/prei:cached
    environment:
      DJANGO_SETTINGS_MODULE: investor_app.settings
      # DEVCONTAINER ONLY — matches db.POSTGRES_PASSWORD below; do not reuse outside local development
      DATABASE_URL: postgres://prei:devcontainer-only-postgres-password-change-me@db:5432/prei
      # DEVCONTAINER ONLY — do not reuse this key outside local development
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "True"
      # DEVCONTAINER ONLY — '*' disables host-header validation; never use in production
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.6-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_DB: prei
      POSTGRES_USER: prei
      # DEVCONTAINER ONLY — do not reuse this password outside local development
      POSTGRES_PASSWORD: devcontainer-only-postgres-password-change-me
    volumes:
      - devcontainer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prei -d prei"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devcontainer-postgres-data:
